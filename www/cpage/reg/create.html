<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Bank Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }

      .form-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .form-header {
        text-align: center;
        margin-bottom: 20px;
      }

      .form-header h2 {
        margin: 0;
        color: #3498db;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
      }
      .input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .button {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: #3498db;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      .button:hover {
        background-color: #2980b9;
      }
      .delete-button {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: #e74c3c;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 16px;
        text-align: center;
      }
      .delete-button:hover {
        background-color: #c0392b;
      }
      a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- Naya aur Match karta hua Navbar -->
    <nav class="bg-blue-600 p-4 shadow-md">
      <div class="container mx-auto flex justify-between items-center">
        <a href="#" class="text-white text-xl font-bold tracking-wide"
          >Bank Portal</a
        >
        <div class="space-x-2">
          <a
            href="home.html"
            class="text-white bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded transition duration-200"
            >Home</a
          >
          <a
            href="create.html"
            class="text-white bg-black hover:bg-blue-700 px-4 py-2 rounded transition duration-200 font-medium"
            >Create Account</a
          >
          <a
            href="delete.html"
            class="text-white bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition duration-200"
            >Delete Account</a
          >
        </div>
      </div>
    </nav>

    <!-- Create Account Form -->
    <div class="form-container">
      <div class="form-header">
        <h2>Create Account</h2>
      </div>
      <form action="create.php" method="POST">
        <div class="form-group">
          <label for="number">Account Number:</label>
          <input type="text" id="number" name="number" class="input" required />
        </div>
        <div class="form-group">
          <label for="name">Customer Name:</label>
          <input type="text" id="name" name="name" class="input" required />
        </div>
        <div class="form-group">
          <label for="type">Account Type:</label>
          <input type="text" id="type" name="type" class="input" required />
        </div>
        <div class="form-group">
          <label for="balance">Balance:</label>
          <input
            type="text"
            id="balance"
            name="balance"
            class="input"
            required
          />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="text" id="phone" name="phone" class="input" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="input" required />
        </div>
        <div class="form-group">
          <label for="date">Opening Date:</label>
          <input type="date" id="date" name="date" class="input" required />
        </div>
        <button type="submit" class="button">Create Account</button>
        <div>
          <a href="delete.html" class="delete-button">
            Delete Account &gt;&gt;
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
