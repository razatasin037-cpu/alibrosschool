<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Cars Details</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 90vh;
      }

      .container {
        width: 420px;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .container h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #0f172a;
      }

      label {
        display: block;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
      }

      input[type="submit"] {
        width: 100%;
        background: #2563eb;
        color: white;
        border: none;
        padding: 13px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      input[type="submit"]:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

      @media (max-width: 500px) {
        .container {
          width: 95%;
          padding: 20px;
        }

        .container h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Cars Details</h1>
      <form action="submit_car.php" method="post">
        <label for="make">Make:</label>
        <input type="text" id="make" name="make" required /><br /><br />

        <label for="model">Model:</label>
        <input type="text" id="model" name="model" required /><br /><br />

        <label for="year">Year:</label>
        <input type="number" id="year" name="year" required /><br /><br />

        <label for="color">Color:</label>
        <input type="text" id="color" name="color" required /><br /><br />

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required /><br /><br />

        <label for="mileage">Mileage:</label>
        <input type="number" id="mileage" name="mileage" required /><br /><br />

        <label for="transmission">Transmission:</label>
        <select id="transmission" name="transmission" required>
          <option value="">Select Transmission</option>
          <option value="automatic">Automatic</option>
          <option value="manual">Manual</option></select
        ><br /><br />

        <input type="submit" value="Submit" />
      </form>
    </div>
  </body>
</html>
