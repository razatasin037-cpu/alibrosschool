<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 15px;
            color: #2c3e50;
            transition: border-color 0.3s ease;
        }

        /* Input focus effect */
        .form-group input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h2>Student Registration</h2>
    </div>

    <form action="insert.php" method="POST">
        
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="NAME" maxlength="20" required placeholder="Enter full name">
        </div>
        <div class="form-group">
            <label for="class">Class</label>
            <input type="number" id="class" name="CLASS" min="1" max="12" required placeholder="1
            -12">
        </div>
        <div class="form-group">
            <label for="roll_no">Roll Number</label>
            <input type="number" id="roll_no" name="ROLL_NO" min="1" max="99999999" required placeholder="Enter roll number">
        </div>
        <div class="form-group">
            <label for="section">Section</label>
            <input type="text" id="section" name="SECTION" maxlength="10" required placeholder="section">
        </div>
        <div class="form-group">
            <label for="password">Password (Numbers Only)</label>
            <input type="password" id="password" name="PASSWORD" required placeholder="Enter number password">
        </div>
        <button type="submit" class="submit-btn">Submit Data</button>

    </form>
</div>

</body>
</html>
