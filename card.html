<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#020617] p-10">
    <!-- CARD YAHA AAYEGA -->
    <div id="card"></div>

    <script>
      // REUSABLE CARD
      function codeCard(title, code) {
        return `

<div
class="
max-w-[1500px]
mx-auto
rounded-[40px]
border
border-blue-500
bg-gradient-to-r
from-[#020617]
to-[#1e293b]
p-10
"
>

<h1
class="
text-white
text-6xl
font-bold
mb-10
"
>
${title}
</h1>


<div
class="
bg-[#010826]
rounded-[30px]
border-l-[10px]
border-blue-500
p-12
overflow-auto
"
>

<pre
class="
text-[28px]
leading-[60px]
text-white
"
>
${code}
</pre>

</div>

</div>

`;
      }

      // BAS CALL KARO
      document.getElementById("card").innerHTML = codeCard(
        "Example",

        `#include <iostream>

using namespace std;

int main(){

cout << "Hello World!";

return 0;

}`,
      );
    </script>
  </body>
</html>
